services:
  waypoint:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_MODE: ${APP_MODE:-live}
      RUNTIME_MODE: server
      AUTO_MIGRATE: "false"
      STREAM_ENABLED: "true"
      SCHEDULER_ENABLED: "true"
      DATABASE_URL: ${WAYPOINT_HOSTED_DATABASE_URL:?Set WAYPOINT_HOSTED_DATABASE_URL in .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://www.theevanmiles.com}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
