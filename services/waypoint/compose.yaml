services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_DB: waypoint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - waypoint_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint -d waypoint"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  waypoint_postgres:
