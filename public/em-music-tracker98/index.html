<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EM · Music Tracker</title>

  <!-- Private page: keep it out of search indexes. Pair with the X-Robots-Tag
       header and robots.txt described in the README for belt-and-braces. -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="theme-color" content="#0B0D0A">
  <meta name="description" content="Private goal tracker for Evan Miles.">

  <!-- Home-screen icon (iOS) + web-app manifest (Android) + tab favicon. -->
  <link rel="apple-touch-icon" href="/em-music-tracker98/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/em-music-tracker98/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/em-music-tracker98/favicon-32.png">
  <link rel="manifest" href="/em-music-tracker98/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EM Tracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- IBM Plex Mono, matching theevanmiles.com. Falls back to system mono. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Absolute paths under the deploy route: the host (Vercel) serves this page
       at /em-music-tracker98 with NO trailing slash, so relative paths would
       resolve against the site root. -->
  <link rel="stylesheet" href="/em-music-tracker98/styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="mark">EM</div>
        <h1>Music Tracker</h1>
        <span class="sync-badge" id="sync-badge" title="Sync status"></span>
        <span class="private">Private</span>
      </div>
      <nav class="tabs" id="tabs"><!-- tabs injected by app.js --></nav>
    </header>

    <main id="view"><!-- active section injected by app.js --></main>
  </div>

  <!-- end-of-month reminder popup mounts here -->
  <div id="modal-root"></div>

  <!-- Load order matters: config + seed define globals, store reads them,
       sync wires cloud sync, app renders. -->
  <script src="/em-music-tracker98/js/config.js"></script>
  <script src="/em-music-tracker98/js/seed.js"></script>
  <script src="/em-music-tracker98/js/store.js"></script>
  <script src="/em-music-tracker98/js/sync.js"></script>
  <script src="/em-music-tracker98/js/app.js"></script>
</body>
</html>
